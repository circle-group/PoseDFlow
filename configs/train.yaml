defaults:
  - _self_
  - experiment: null
  - override hydra/launcher: submitit_slurm
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

data: pose  # {volcano,earthquake,fire,flood}
pose_datadir: ${hydra:runtime.cwd}/data/amass
output_dir: outputs

# Only used for sampling from wrapped distributions.
wrapped:
  dim: 5
  n_mixtures: 1
  scale: 0.2

# mesh:
#   # Parameters for defining distance on discrete mesh.
#   numeigs: 100
#   metric: biharmonic  # {diffusion, biharmonic, commutetime}
#   temp: 0.25
#   nsteps: 200  # number of steps for solving the path
#   time_eps: 1e-5
#   projx: True
#   method: euler
#   atol: 1e-5
#   rtol: 1e-5

model:
  d_model: 512
  num_layers: 4
  actfn: swish
  fourier: null
  atol: 1e-7
  rtol: 1e-7
  metric_normalize: False

optim:
  num_iterations: 50_000
  batch_size: 4096
  val_batch_size: 4096
  n_workers: 6

  scheduler: reduce_lr_on_plateau
  grad_clip: 1.0
  lr: 1e-3
  wd: 1e-4
  eps: 1e-8
  ema_decay: 0.99
  patience: 3

normalize_loglik: False
early_stopping_patience: 5  # this is affected by val_every
early_stopping_min_delta: 1e-3

use_wandb: True

body_model:
  smpl_folder: ${hydra:runtime.cwd}/data/human_model_files/
  smpl_type: smpl
  ext: npz
  gender: neutral
  log_imgs_every: 1 # log images every n epochs

seed: 0

val_every: 1000
ckpt_every: 1000
visualize: True
gt_mean_var_path: ${hydra:runtime.cwd}/examples/gt_mean_var.npz

eval_projx: False
local_coords: False

hydra:
  job:
    chdir: True
  run:
    dir: ${output_dir}/runs/${data}/fm/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: ${output_dir}/multiruns/${data}/fm/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100_000
    timeout_min: 4319
    cpus_per_task: 10
    gpus_per_node: 1
    nodes: 1
    partition: learnlab
    constraint: volta32gb
